spring.application.name=saarthi-backend
server.port=${PORT:8080}

# PostgreSQL Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/saarthidb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate DDL auto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Public Overpass endpoint can be replaced without changing application code
osm.overpass.url=${OSM_OVERPASS_URL:https://overpass-api.de/api/interpreter}

# Stripe payment lifecycle
stripe.secret-key=${STRIPE_API_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Gemini symptom-guidance integration. The API key stays on the backend and is sent as a header.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.connect-timeout=${GEMINI_CONNECT_TIMEOUT:5s}
gemini.read-timeout=${GEMINI_READ_TIMEOUT:30s}

# Small demo-oriented window: tolerate an isolated failure, but stop repeated failing calls quickly.
resilience4j.circuitbreaker.instances.geminiCircuit.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.geminiCircuit.sliding-window-size=4
resilience4j.circuitbreaker.instances.geminiCircuit.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.geminiCircuit.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.geminiCircuit.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.geminiCircuit.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.geminiCircuit.automatic-transition-from-open-to-half-open-enabled=false
